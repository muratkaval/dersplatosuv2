    <!-- dp-seo-injector -->
    <script>
    (function () {
        try {
            var s = JSON.parse(localStorage.getItem('dp_seo_settings') || '{}');
            if (!s || !Object.keys(s).length) return;
            var h = document.head;
            
            // Mevcut meta etiketini bulup günceller, yoksa yenisini oluşturur
            function up(n, c, isProp) {
                if(!c) return;
                var sel = isProp ? 'meta[property="' + n + '"]' : 'meta[name="' + n + '"]';
                var el = document.querySelector(sel);
                if (el) { el.content = c; } 
                else {
                    var m = document.createElement('meta');
                    isProp ? m.setAttribute('property', n) : m.name = n;
                    m.content = c;
                    h.appendChild(m);
                }
            }
            
            function addScript(code) { var t = document.createElement('script'); t.textContent = code; h.appendChild(t); }
            function addSrcScript(src) { var t = document.createElement('script'); t.async = true; t.src = src; h.appendChild(t); }
            function upFavicon(url) {
                if (!url) return;
                ['icon', 'shortcut icon', 'apple-touch-icon'].forEach(function (rel) {
                    var el = document.querySelector('link[rel="' + rel + '"]');
                    if (!el) {
                        el = document.createElement('link');
                        el.setAttribute('rel', rel);
                        h.appendChild(el);
                    }
                    el.setAttribute('href', url);
                });
            }
            
            // Temel SEO & Open Graph
            if (s.title) document.title = s.title;
            up('description', s.desc, false);
            up('keywords', s.keywords, false);
            up('author', s.author, false);
            up('og:site_name', s.siteName, true);
            up('og:title', s.ogTitle, true);
            up('og:description', s.ogDesc, true);
            up('og:image', s.ogImage, true);
            upFavicon(s.faviconUrl || s.iconUrl);

            // Dinamik sayfalarda canonical URL'yi mevcut adresle eşitle
            var c = document.querySelector('link[rel="canonical"]');
            if (!c) {
                c = document.createElement('link');
                c.setAttribute('rel', 'canonical');
                h.appendChild(c);
            }
            c.setAttribute('href', window.location.href.split('#')[0]);

            // Doğrulama & Analitik
            if (s.googleVerify) up('google-site-verification', s.googleVerify, false);
            if (s.bingVerify) up('msvalidate.01', s.bingVerify, false);
            if (s.yandexVerify) up('yandex-verification', s.yandexVerify, false);
            
            if (s.ga4Id) { addSrcScript('https://www.googletagmanager.com/gtag/js?id=' + s.ga4Id); addScript('window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","' + s.ga4Id + '");'); }
            if (s.gtmId) { addScript('(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({"gtm.start":new Date().getTime(),event:"gtm.js"});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!="dataLayer"?"&l="+l:"";j.async=true;j.src="https://www.googletagmanager.com/gtm.js?id="+i+dl;f.parentNode.insertBefore(j,f);})(window,document,"script","dataLayer","' + s.gtmId + '");'); }
            if (s.fbPixelId) { addScript('!function(f,b,e,v,n,t,s2){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s2=b.getElementsByTagName(e)[0];s2.parentNode.insertBefore(t,s2)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");fbq("init","' + s.fbPixelId + '");fbq("track","PageView");'); }
            
            // Özel Kodlar
        } catch (e) { }
    })();
</script>

    <script>
        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // URL'den slug oku: hem /sayfa/slug hem de ?slug= formatını destekle
        const params = new URLSearchParams(window.location.search);
        let slug = params.get('slug');
        if (!slug) {
            const pathMatch = window.location.pathname.match(/\/sayfa\/([^\/]+)$/);
            if (pathMatch) slug = decodeURIComponent(pathMatch[1]);
        }
        // Eski ?slug= formatındaysa URL'yi temiz path'e çevir
        if (slug && window.location.search.includes('slug=')) {
            history.replaceState(null, '', '/sayfa/' + slug);
        }

        async function loadPage() {
            const titleEl = document.getElementById('pageTitle');
            const contentEl = document.getElementById('pageContent');

            if (!slug) {
                titleEl.textContent = 'Sayfa Bulunamadı';
                contentEl.innerHTML = '<div class="page-error"><h2>Geçersiz bağlantı.</h2><p>Lütfen ana sayfaya dönün.</p></div>';
                return;
            }

            try {
                const res = await fetch(
                    `${STRAPI_URL}/pages?filters[slug][$eq]=${slug}&populate=*`,
                    { headers: strapiHeaders }
                );
                const data = await res.json();
                const page = data.data?.[0];

                if (!page) {
                    titleEl.textContent = 'Sayfa Bulunamadı';
                    document.title = 'Sayfa Bulunamadı - Ders Platosu';
                    contentEl.innerHTML = `
                        <div class="page-error">
                            <h2>😕 Bu sayfa bulunamadı.</h2>
                            <p>Aradığınız sayfa mevcut değil veya kaldırılmış olabilir.</p>
                            <a href="/" class="btn-primary" style="margin-top:20px;display:inline-block">Ana Sayfaya Dön</a>
                        </div>`;
                    return;
                }

                const attr = page.attributes || page;
                const title = attr.title || 'Sayfa';
                const content = attr.content || '';

                // Başlık güncelle
                titleEl.textContent = title;
                document.title = `${title} - Ders Platosu`;

                // Markdown render sonrasında sanitize ederek XSS riskini düşür.
                const renderedHtml = (typeof marked !== 'undefined')
                    ? marked.parse(content)
                    : `<p>${escapeHtml(content).replace(/\n/g, '<br>')}</p>`;
                contentEl.innerHTML = (typeof DOMPurify !== 'undefined')
                    ? DOMPurify.sanitize(renderedHtml)
                    : `<p>${escapeHtml(content).replace(/\n/g, '<br>')}</p>`;

            } catch (err) {
                // Sessiz fallback: production'da detay log basma.
                titleEl.textContent = 'Hata';
                contentEl.innerHTML = '<div class="page-error"><h2>Sayfa yüklenemedi.</h2><p>Lütfen daha sonra tekrar deneyin.</p></div>';
            }
        }

        loadPage();
    </script>
