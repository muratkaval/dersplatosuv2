        (async function () {
            var path = window.location.pathname.replace(/\/+$/, '') || '/';
            var pageUrl = 'https://dersplatosu.com' + path;
            var c = document.getElementById('pageCanonical');
            var ogu = document.getElementById('pageOgUrl');
            var twu = document.getElementById('pageTwUrl');

            if (ogu) ogu.setAttribute('content', pageUrl);

            // Hoca SEO alanlarını doldur

                var slug = path.split('/').pop();

                    var ogDesc = seoDesc;
                    var ogImage = hoca.photo?.data?.attributes?.url ? hoca.photo.data.attributes.url : 'https://i.hizliresim.com/ag3gf4d.png';

                    document.getElementById('pageTitle').textContent = seoTitle;

                    document.getElementById('pageTwTitle').setAttribute('content', ogTitle);

    <script>
    (function () {
        // ── Slug okuma ──
        var pathMatch = window.location.pathname.match(/^\/hoca\/([^/]+)$/);
        var hocaSlug = pathMatch ? decodeURIComponent(pathMatch[1]) : '';
        if (!hocaSlug) {
            var p = new URLSearchParams(window.location.search);
            hocaSlug = p.get('slug') || '';
        }

        if (!hocaSlug) {
            showNotFound('Hoca slug\'u belirtilmemiş.');
            return;
        }

        // ── Strapi config (main.js'ten miras) ──
        // STRAPI_URL, strapiHeaders, fixImgUrl, escHtml, slugify, safeHref, extractYouTubeId, extractPlaylistId, slugify
        // hepsi main.js tarafından global olarak tanımlı

        async function loadHoca() {
            try {
                var queryNoCampCover = [
                    'fields[0]=name',
                    'fields[1]=youtube',
                    'fields[2]=instagram',
                    'populate[photo][fields][0]=url',
                    'populate[photo][fields][1]=formats',
                    'populate[subjects][fields][0]=name',
                    'populate[books][populate][cover][fields][0]=url',
                    'populate[books][populate][cover][fields][1]=formats',
                    'populate[books][fields][0]=title',
                    'populate[books][fields][1]=buy_link',
                    'populate[books][fields][2]=solution_link',
                    'populate[camps][fields][0]=title',
                    'populate[camps][fields][1]=introVideo',
                    'populate[camps][fields][2]=playlist',
                    'populate[camps][fields][3]=slug',
                    'populate[camps][populate][books][populate][cover][fields][0]=url',
                    'populate[camps][populate][books][populate][cover][fields][1]=formats',
                    'populate[camps][populate][books][fields][0]=title',
                    'populate[camps][populate][books][fields][1]=buy_link',
                    'populate[camps][populate][books][fields][2]=solution_link',
                    'pagination[pageSize]=100'
                ].join('&');

                var queryLegacy = [
                    'fields[0]=name',
                    'fields[1]=youtube',
                    'fields[2]=instagram',
                    'populate[photo][fields][0]=url',
                    'populate[subjects][fields][0]=name',
                    'populate[camps][fields][0]=title',
                    'populate[camps][fields][1]=introVideo',
                    'populate[camps][fields][2]=playlist',
                    'populate[camps][fields][3]=slug',
                    'pagination[pageSize]=100'
                ].join('&');

                var queryPlan = [queryNoCampCover, queryLegacy];
                var instructors = [];

                for (var qi = 0; qi < queryPlan.length; qi++) {
                    var res = await fetch(STRAPI_URL + '/instructors?' + queryPlan[qi], { headers: strapiHeaders });
                    var data = {};
                    try { data = await res.json(); } catch (e) { data = {}; }
                    if (res.ok && !data.error) {
                        instructors = data.data || [];
                        break;
                    }
                }

                if (!Array.isArray(instructors) || instructors.length === 0) {
                    showNotFound('Hoca verileri yüklenemedi. Lütfen tekrar deneyin.');
                    return;
                }

                function normSlug(v) {
                    return slugify(String(v || ''))
                        .replace(/^-+|-+$/g, '')
                        .replace(/-+/g, '-');
                }

                var targetSlug = normSlug(hocaSlug);

                // slug ile eşleştir
                var matched = null;
                for (var i = 0; i < instructors.length; i++) {
                    var inst = instructors[i].attributes || instructors[i];
                    var instSlug = normSlug(inst.slug || inst.name || '');
                    if (instSlug && instSlug === targetSlug) {
                        matched = inst;
                        break;
                    }
                }

                // Eski URL'ler veya ad degisikligi icin toleransli fallback
                if (!matched && targetSlug) {
                    for (var j = 0; j < instructors.length; j++) {
                        var inst2 = instructors[j].attributes || instructors[j];
                        var instSlug2 = normSlug(inst2.slug || inst2.name || '');
                        if (!instSlug2) continue;
                        if (targetSlug.indexOf(instSlug2) === 0 || instSlug2.indexOf(targetSlug) === 0) {
                            matched = inst2;
                            break;
                        }
                    }
                }

                if (!matched) {
                    showNotFound('Bu hoca bulunamadı.');
                    return;
                }

                renderHoca(matched);
            } catch (err) {
                showNotFound('Veriler yüklenemedi. Lütfen sayfayı yenileyin.');
            }
        }

        function renderHoca(d) {
            // ── Photo ──
            var photoObj = d.photo && d.photo.data ? d.photo.data.attributes : d.photo;
            var photoUrl = null;
            if (photoObj) {
                photoUrl = (photoObj.formats && (photoObj.formats.medium || photoObj.formats.small || photoObj.formats.thumbnail))
                    ? fixImgUrl((photoObj.formats.medium || photoObj.formats.small || photoObj.formats.thumbnail).url)
                    : fixImgUrl(photoObj.url || '');
            }

            var photoWrap = document.getElementById('hocaPhotoWrap');
            photoWrap.innerHTML = (photoUrl
                ? '<img src="' + escHtml(photoUrl) + '" alt="' + escHtml(d.name || '') + '" onerror="this.parentElement.querySelector(\'img\').style.display=\'none\';this.parentElement.querySelector(\'.hoca-photo-fallback\').style.display=\'flex\'">'
                : '') +
                '<div class="hoca-photo-fallback" style="' + (photoUrl ? 'display:none' : '') + '">👨‍🏫</div>';

            // ── Name ──
            var name = d.name || 'Hoca';
            document.getElementById('hocaName').textContent = name;

            // ── Subject ──
            var subjectsRaw = (d.subjects && d.subjects.data) ? d.subjects.data : (d.subjects || []);
            var subjectsArr = Array.isArray(subjectsRaw) ? subjectsRaw : [subjectsRaw];
            var firstSub = subjectsArr.length > 0 ? (subjectsArr[0].attributes || subjectsArr[0]) : null;
            var subjectName = firstSub ? (firstSub.name || '') : '';
            if (subjectName) {
                var badge = document.getElementById('hocaSubjectBadge');
                badge.textContent = subjectName;
                badge.style.display = '';
            }

            // ── Socials ──
            var youtubeUrl = safeHref(d.youtube || '', '');
            var instagramUrl = safeHref(d.instagram || '', '');
            var socialsHtml = '';
            if (youtubeUrl) {
                socialsHtml += '<a href="' + youtubeUrl + '" target="_blank" rel="noopener" class="hoca-btn hoca-btn-yt">' +
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.8 15.5V8.5l6.2 3.5-6.2 3.5z"/></svg>' +
                    'YouTube Kanalı</a>';
            }
            if (instagramUrl) {
                socialsHtml += '<a href="' + instagramUrl + '" target="_blank" rel="noopener" class="hoca-btn hoca-btn-ig">' +
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.2 4.8 1.7 5 5 .1 1.3.1 1.6.1 4.7s0 3.4-.1 4.7c-.2 3.3-1.7 4.8-5 5-1.3.1-1.6.1-4.9.1s-3.6 0-4.9-.1c-3.3-.2-4.8-1.7-5-5C2 15.6 2 15.3 2 12s0-3.4.1-4.7c.2-3.3 1.7-4.8 5-5C8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7 .1 2.7.3.3 2.7.1 7 0 8.3 0 8.7 0 12s0 3.7.1 5c.2 4.3 2.6 6.7 7 6.9 1.3.1 1.7.1 5 .1s3.7 0 5-.1c4.3-.2 6.7-2.6 6.9-7C24 15.7 24 15.3 24 12s0-3.7-.1-5c-.2-4.3-2.6-6.7-7-6.9C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4A6.2 6.2 0 0 0 12 5.8zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8z"/></svg>' +
                    'Instagram</a>';
            }
            document.getElementById('hocaSocials').innerHTML = socialsHtml;

            // ── SEO ──
            var rawCamps = (d.camps && d.camps.data) ? d.camps.data : (d.camps || []);
            if (!Array.isArray(rawCamps)) rawCamps = [];
            var campCount = rawCamps.length;
            var hocaSlugFinal = d.slug || slugify(name);
            var pageUrl = 'https://dersplatosu.com/hoca/' + hocaSlugFinal;
            var metaDesc = name + (subjectName ? ' ' + subjectName : '') + ' kampları ve kitapları – Ders Platosu\'nda ücretsiz öğren. ' + campCount + ' kamp mevcut.';
            var ogImg = photoUrl || 'https://i.hizliresim.com/ag3gf4d.png';

            document.title = name + ' – Ders Platosu | Ücretsiz ' + (subjectName || 'YKS') + ' Kampları';
            document.getElementById('pageTitle').textContent = document.title;
            document.getElementById('pageDesc').content = metaDesc;
            document.getElementById('pageCanonical').href = pageUrl;
            document.getElementById('pageOgTitle').content = name + ' – Ders Platosu';
            document.getElementById('pageOgDesc').content = metaDesc;
            document.getElementById('pageOgUrl').content = pageUrl;
            document.getElementById('pageOgImage').content = ogImg;
            document.getElementById('pageTwTitle').content = name + ' – Ders Platosu';
            document.getElementById('pageTwDesc').content = metaDesc;
            document.getElementById('pageTwImage').content = ogImg;

            // JSON-LD Person + ItemList structured data
            var jsonLd = {
                '@context': 'https://schema.org',
                '@type': 'Person',
                'name': name,
                'url': pageUrl,
                'image': ogImg,
                'jobTitle': (subjectName ? subjectName + ' Öğretmeni' : 'Youtuber Hoca'),
                'worksFor': { '@type': 'Organization', 'name': 'Ders Platosu', 'url': 'https://dersplatosu.com' },
                'sameAs': [youtubeUrl, instagramUrl].filter(Boolean)
            };
            document.getElementById('jsonLd').textContent = JSON.stringify(jsonLd);

            // ── Show hero ──
            document.getElementById('hocaHeroLoading').style.display = 'none';
            document.getElementById('hocaHero').style.display = '';

            // ── Kamplar ──
            if (rawCamps.length > 0) {
                var campsGrid = document.getElementById('hocaCampsGrid');
                var campsHtml = rawCamps.map(function (camp) {
                    var c = camp.attributes || camp;
                    var videoId = extractYouTubeId(c.introVideo || '');
                    var campCover = c.cover?.data?.attributes || c.cover;
                    var coverUrl = campCover?.formats?.medium?.url
                        ? fixImgUrl(campCover.formats.medium.url)
                        : campCover?.formats?.small?.url
                            ? fixImgUrl(campCover.formats.small.url)
                            : campCover?.formats?.thumbnail?.url
                                ? fixImgUrl(campCover.formats.thumbnail.url)
                                : campCover?.url
                                    ? fixImgUrl(campCover.url)
                                    : '';
                    var campSlugVal = c.slug || slugify(c.title || '');
                    var url = campSlugVal ? '/egitim/' + campSlugVal : (videoId ? '/egitim?v=' + videoId : '#');
                    var thumb = coverUrl || (videoId ? 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg' : '');
                    var campTitle = escHtml(c.title || 'Kamp');
                    return '<a href="' + url + '" class="course-card">' +
                        '<div class="course-thumb" style="background:' + (thumb ? 'url(\'' + thumb + '\') center/cover no-repeat' : 'var(--bg-secondary)') + '">' +
                        (videoId ? '<div class="course-play-btn"></div>' : '') +
                        '</div>' +
                        '<div class="course-body">' +
                        (subjectName ? '<span class="course-tag">' + escHtml(subjectName) + '</span>' : '') +
                        '<h3>' + campTitle + '</h3>' +
                        '</div>' +
                        '</a>';
                }).join('');

                campsGrid.innerHTML = campsHtml;

                // hqdefault → mqdefault fallback
                campsGrid.querySelectorAll('.course-thumb').forEach(function (el) {
                    var bg = el.style.backgroundImage;
                    var m = bg && bg.match(/vi\/([^/]+)\/hqdefault/);
                    if (m && typeof ytThumbBgFallback === 'function') ytThumbBgFallback(m[1], el);
                });

                document.getElementById('hocaCampsSection').style.display = '';
            }

            // ── Kitaplar (doğrudan + kamplar üzerinden) ──
            var seenBookIds = new Set();
            var allBooks = [];
            function addBook(book) {
                var b = book.attributes || book;
                var bookId = book.id || book.documentId || b.id || b.documentId || '';
                var key = String(bookId);
                if (key && seenBookIds.has(key)) return;
                if (key) seenBookIds.add(key);
                var cover = (b.cover && b.cover.data) ? b.cover.data.attributes : b.cover;
                var coverUrl = null;
                if (cover) {
                    if (cover.formats && cover.formats.small) coverUrl = fixImgUrl(cover.formats.small.url);
                    else if (cover.formats && cover.formats.thumbnail) coverUrl = fixImgUrl(cover.formats.thumbnail.url);
                    else if (cover.url) coverUrl = fixImgUrl(cover.url);
                }
                allBooks.push({
                    title: escHtml(b.title || 'Kitap'),
                    cover: coverUrl || 'https://via.placeholder.com/200x280?text=Kitap',
                    buyLink: safeHref(b.buy_link || '/kitaplar', '/kitaplar'),
                    demoLink: safeHref(b.solution_link || '', '')
                });
            }
            var directBooks = (d.books && d.books.data) ? d.books.data : (d.books || []);
            if (Array.isArray(directBooks)) directBooks.forEach(addBook);
            rawCamps.forEach(function (camp) {
                var c = camp.attributes || camp;
                var bks = (c.books && c.books.data) ? c.books.data : (c.books || []);
                if (Array.isArray(bks)) bks.forEach(addBook);
            });

            if (allBooks.length > 0) {
                var booksGrid = document.getElementById('hocaBooksGrid');
                booksGrid.innerHTML = allBooks.map(function (b) {
                    return '<div class="hoca-book-card">' +
                        '<img class="hoca-book-cover" src="' + escHtml(b.cover) + '" alt="' + b.title + '" loading="lazy">' +
                        '<div class="hoca-book-body">' +
                        '<h4>' + b.title + '</h4>' +
                        '<div class="hoca-book-btns">' +
                        '<a href="' + escHtml(b.buyLink) + '" class="btn-buy" target="_blank" rel="noopener">📦 Satın Al ↗</a>' +
                        (b.demoLink ? '<a href="' + escHtml(b.demoLink) + '" class="btn-demo" target="_blank" rel="noopener">🔎 Kitabı İncele</a>' : '') +
                        '</div></div></div>';
                }).join('');
                document.getElementById('hocaBooksSection').style.display = '';
            }

            if (rawCamps.length === 0 && allBooks.length === 0) {
                document.getElementById('hocaEmpty').style.display = '';
            }

            // ── Hide loading, show content ──
            document.getElementById('hocaLoading').style.display = 'none';
            document.getElementById('hocaContent').style.display = '';
        }

        function showNotFound(msg) {
            document.getElementById('hocaHeroLoading').style.display = 'none';
            document.getElementById('hocaLoading').style.display = 'none';
            document.getElementById('hocaContent').style.display = '';
            document.getElementById('hocaContent').innerHTML =
                '<div class="hoca-not-found">' +
                '<h2>Hoca Bulunamadı</h2>' +
                '<p>' + escHtml(msg) + '</p>' +
                '<p style="margin-top:16px"><a href="/youtuber-hocalar">← Tüm Hocalar</a></p>' +
                '</div>';
        }

        loadHoca();
    })();
    </script>
</body>
</html>
