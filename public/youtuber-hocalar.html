        /* ── Unified Page Hero ── */
        .page-hero {
            background: var(--bg-secondary, #f0f4fa);
            border-bottom: 1px solid var(--border, #e5e9f0);
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        .page-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
        }

        .page-hero-inner {
            max-width: 620px;
            margin: 0 auto;
            padding: calc(var(--nav-h, 64px) + 44px) 24px 44px;
            text-align: center;
        }

        .page-hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            background: rgba(59, 130, 246, .07);
            border: 1px solid rgba(59, 130, 246, .18);
            border-radius: 50px;
            color: #3b82f6;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .page-hero h1 {
            font-size: 2.15rem;
            font-weight: 800;
            color: var(--text, #0f172a);
            line-height: 1.18;
            letter-spacing: -.025em;
            margin-bottom: 14px;
        }

        .page-hero h1 span {
            color: #3b82f6;
        }

        .page-hero p {
            color: var(--text-muted, #64748b);
            font-size: .95rem;
            line-height: 1.7;
        }

        [data-theme="dark"] .page-hero {
            background: #0b1221;
            border-bottom-color: #1e293b;
        }

        [data-theme="dark"] .page-hero h1 {
            color: #f1f5f9;
        }

        [data-theme="dark"] .page-hero p {
            color: #64748b;
        }

        [data-theme="dark"] .page-hero-eyebrow {
            background: rgba(59, 130, 246, .1);
            border-color: rgba(59, 130, 246, .22);
            color: #60a5fa;
        }

        @media (max-width: 600px) {
            .page-hero h1 {
                font-size: 1.65rem;
            }

            .page-hero-inner {
                padding-top: calc(var(--nav-h, 64px) + 28px);
